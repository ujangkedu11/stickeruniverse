<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticker Universe</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #051524;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 20%; 
            border: 3px solid #1091b9;
            object-fit: cover;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 5px 0;
        }

        p {
            font-size: 14px;
            color: #aaaaaa;
            margin: 0 0 30px 0;
        }

        .btn-link {
            display: block;
            background-color: #1f1f1f;
            color: #ffffff;
            text-decoration: none;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 12px;
            font-weight: bold;
            transition: all 0.3s ease;
            border: 1px solid #333333;
        }

        .btn-link:hover {
            transform: translateY(-3px);
        }

        .btn-whatsapp {
            background-color: #157e02;
            color: #ffffff;
            border: none;
        }

        .btn-youtube {
            border-left: 5px solid #ff0000;
        }

        .btn-trakteer {
            border-left: 5px solid #0e95e9;
        }

        .footer {
            font-size: 11px;
            color: #555555;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="profile-img" src="picture\logo.jpg" alt="Logo">

        <a href="https://youtube.com/@stickeruniverse?si=Yfmr4pdl-TR4fW7d" class="btn-link btn-youtube" target="_blank">🔴 Follow Cabang Youtube</a>    
        <a href="https://trakteer.id/stickeruniverse" class="btn-link btn-trakteer" target="_blank">🐟 Beliin admin iwak</a>
        <div class="footer">
            © 2026 Sticker Universe. Powered by Github.
        </div>
    </div>
</body>
</html>
